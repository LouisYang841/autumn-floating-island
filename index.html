      uniform float uFocusY,uStrength,uSpread;
      varying vec2 vUv;
      void main(){
        vec4 pixel=texture2D(tColor,vUv);
        // A sharply focused horizontal strip, softly feathering into blur.
        // The centre is projected from the tree each frame, not fixed in world Z.
        float distanceToBand=abs(vUv.y-uFocusY);
        float amount=smoothstep(.115,.425,distanceToBand)*uStrength;
        vec3 color=pixel.rgb;
        if(amount>.003){
          vec2 offset=uDirection*(uSpread*amount)/uResolution;
          color=pixel.rgb*.2270270270;
          color+=(texture2D(tColor,clamp(vUv+offset,vec2(0.0),vec2(1.0))).rgb+
                  texture2D(tColor,clamp(vUv-offset,vec2(0.0),vec2(1.0))).rgb)*.1945945946;
          color+=(texture2D(tColor,clamp(vUv+offset*2.0,vec2(0.0),vec2(1.0))).rgb+
                  texture2D(tColor,clamp(vUv-offset*2.0,vec2(0.0),vec2(1.0))).rgb)*.1216216216;
          color+=(texture2D(tColor,clamp(vUv+offset*3.0,vec2(0.0),vec2(1.0))).rgb+
                  texture2D(tColor,clamp(vUv-offset*3.0,vec2(0.0),vec2(1.0))).rgb)*.0540540541;
          color+=(texture2D(tColor,clamp(vUv+offset*4.0,vec2(0.0),vec2(1.0))).rgb+
                  texture2D(tColor,clamp(vUv-offset*4.0,vec2(0.0),vec2(1.0))).rgb)*.0162162162;
        }
        gl_FragColor=vec4(color,1.0);
        ${finalOutput?'#include <tonemapping_fragment>\n#include <colorspace_fragment>':''}
      }`;
    function blurMaterial(input,horizontal,finalOutput){
      return new THREE.ShaderMaterial({
        uniforms:{tColor:{value:input},uResolution:{value:new THREE.Vector2(1,1)},
          uDirection:{value:new THREE.Vector2(horizontal?1:0,horizontal?0:1)},
          uFocusY:{value:.52},uStrength:{value:1},uSpread:{value:3.3}},
        vertexShader:blurVertex,fragmentShader:makeBlurFragment(finalOutput),
        depthTest:false,depthWrite:false,transparent:false,toneMapped:finalOutput
      });
    }
    const horizontalMat=blurMaterial(sceneTarget.texture,true,false);
    const verticalMat=blurMaterial(horizontalTarget.texture,false,true);
    verticalMat.toneMapped=hdrSupported;
    const postScene=new THREE.Scene();
    const postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
    const postQuad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),verticalMat);
    postQuad.frustumCulled=false;postScene.add(postQuad);
    let dofOn=true;
    const focusPoint=new THREE.Vector3(0,2.85,0);
    const projectedFocus=new THREE.Vector3();
    function updateTiltFocus(){
      // Recalculate the sharp band as camera orbits / zooms around the tree.
      projectedFocus.copy(focusPoint).project(camera);
      const y=clamp(.5+.5*projectedFocus.y,.32,.68);
      horizontalMat.uniforms.uFocusY.value=y;
      verticalMat.uniforms.uFocusY.value=y;
    }
    function renderWithTiltShift(){
      const toneMapping=renderer.toneMapping;
      // Avoid tone mapping *twice*: retain high-precision scene radiance in the
      // half-float target, then tone map exactly once on the final fullscreen pass.
      renderer.toneMapping=hdrSupported?THREE.NoToneMapping:toneMapping;
      renderer.setRenderTarget(sceneTarget);
      renderer.render(scene,camera);
      if(dofOn){
        horizontalMat.uniforms.uStrength.value=1;
        verticalMat.uniforms.uStrength.value=1;
        renderer.setRenderTarget(horizontalTarget);
        postQuad.material=horizontalMat;
        renderer.render(postScene,postCam);
        verticalMat.uniforms.tColor.value=horizontalTarget.texture;
      }else{
        // Exact same HDR-to-display path without blur: no brightness jump.
        verticalMat.uniforms.uStrength.value=0;
        verticalMat.uniforms.tColor.value=sceneTarget.texture;
      }
      renderer.toneMapping=hdrSupported?toneMapping:THREE.NoToneMapping;
      renderer.setRenderTarget(null);
      postQuad.material=verticalMat;
      renderer.render(postScene,postCam);
    }
    const stars=document.getElementById('stars');
    for(let i=0;i<34;i++){
      const dot=document.createElement('i');dot.style.left=`${(i*63.71+11)%100}%`;
      dot.style.top=`${(i*29.37+7)%75}%`;dot.style.opacity=String(.2+(i%5)*.12);
      stars.appendChild(dot);
    }
    // Solar clock: a full 24-hour loop with dynamic sunlight direction, shadow
    // length, sky gradient, ambient lighting, water highlights and star opacity.
    // Sunrise ~06:00 / sunset ~18:00. All values interpolate, no day/night jump.
    const solarStops=[
      {h:0,   bg:['#3d425f','#282f4a','#1e243d'],sun:'#829bd3',sunI:0,hemi:'#829cc9',ground:'#303852',hemiI:.31,bounce:.16,exposure:1.14},
      {h:4.8, bg:['#55526d','#393d58','#262b45'],sun:'#f8a66b',sunI:0,hemi:'#ad9bbc',ground:'#544157',hemiI:.38,bounce:.20,exposure:1.15},
      {h:6,   bg:['#fac9ab','#bf98a7','#777e9b'],sun:'#ffac68',sunI:.27,hemi:'#f4c8b1',ground:'#805b69',hemiI:.63,bounce:.22,exposure:1.18},
      {h:7.5, bg:['#ffe5ca','#ead4c7','#d3b8b4'],sun:'#ffc586',sunI:2.40,hemi:'#ffe5cc',ground:'#796575',hemiI:.83,bounce:.30,exposure:1.20},
      {h:10,  bg:['#f5e8db','#ecd9cd','#e4cdbf'],sun:'#ffdfb0',sunI:3.55,hemi:'#fff1da',ground:'#685971',hemiI:1.00,bounce:.36,exposure:1.25},
      {h:12,  bg:['#f5ebde','#eadbd0','#e3d2c4'],sun:'#fff0cc',sunI:3.86,hemi:'#fcf1dd',ground:'#686879',hemiI:1.08,bounce:.39,exposure:1.24},
      {h:15.5,bg:['#f9e0c9','#e9c7b9','#dcc0ad'],sun:'#ffd09a',sunI:3.12,hemi:'#ffe2c8',ground:'#776071',hemiI:.92,bounce:.31,exposure:1.23},
      {h:17.5,bg:['#ffcb9e','#db9a91','#a48491'],sun:'#ff9b55',sunI:1.34,hemi:'#ffd3b1',ground:'#75566a',hemiI:.71,bounce:.25,exposure:1.20},
      {h:18,  bg:['#eeaa96','#ac7d8f','#656b8a'],sun:'#ff8e56',sunI:.24,hemi:'#e9b6aa',ground:'#664e6e',hemiI:.58,bounce:.22,exposure:1.18},
      {h:19.5,bg:['#6f627c','#474964','#292f4c'],sun:'#819cd5',sunI:0,hemi:'#a8acd3',ground:'#45405c',hemiI:.37,bounce:.19,exposure:1.15},
      {h:21,  bg:['#424762','#2d3450','#1e253e'],sun:'#809cde',sunI:0,hemi:'#99b0e3',ground:'#354067',hemiI:.32,bounce:.18,exposure:1.14},
      {h:24,  bg:['#3d425f','#282f4a','#1e243d'],sun:'#829bd3',sunI:0,hemi:'#829cc9',ground:'#303852',hemiI:.31,bounce:.16,exposure:1.14}
    ].map(s=>({...s,bg:s.bg.map(c=>new THREE.Color(c)),sun:new THREE.Color(s.sun),hemi:new THREE.Color(s.hemi),ground:new THREE.Color(s.ground)}));
    const interpolateColor=(out,a,b,t)=>out.copy(a).lerp(b,t);
    const bgCenter=new THREE.Color(),bgMiddle=new THREE.Color(),bgEdge=new THREE.Color();
    let timeHours=9.5,cyclePlaying=!window.matchMedia('(prefers-reduced-motion:reduce)').matches,lastSkyHours=-100;
    const timeDial=document.getElementById('timeDial');
    const timeArc=document.getElementById('timeArc');
    const timeKnob=document.getElementById('timeKnob');
    const ringCircumference=2*Math.PI*69;
    const timeClock=document.getElementById('timeClock');
    const timeIcon=document.getElementById('timeIcon');
    const timePlayBtn=document.getElementById('timePlayBtn');
    const nightLabel=document.getElementById('nightLabel');
    const formatClock=(h)=>{const m=(Math.round(h*60)+1440)%1440;return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;};
    function describeHour(h){
      if(h<5.5)return ['深夜 · 月光','🌙'];
      if(h<7.5)return ['日出 · 金色晨曦','🌅'];
      if(h<11)return ['上午 · 柔和日光','☀️'];
      if(h<14)return ['正午 · 明亮阳光','☀️'];
      if(h<17.5)return ['午后 · 温暖斜阳','🌤️'];
      if(h<19)return ['日落 · 橙红余晖','🌇'];
      return ['夜晚 · 静谧月色','🌙'];
    }
    function updatePlayButton(){
      timePlayBtn.textContent=cyclePlaying?'Ⅱ 暂停':'▶ 继续';
      timePlayBtn.setAttribute('aria-pressed',String(cyclePlaying));
    }
    function applySolarCycle(forceSky=false){
      const hour=(timeHours%24+24)%24;
      let a=solarStops[0],b=solarStops[1];
      for(let i=1;i<solarStops.length;i++) if(hour<solarStops[i].h){a=solarStops[i-1];b=solarStops[i];break;}
      const f=THREE.MathUtils.smoothstep(hour,a.h,b.h);
      const lerp=(key)=>THREE.MathUtils.lerp(a[key],b[key],f);
      const theta=(hour-6)*Math.PI/12;
      const elevation=Math.sin(theta);
      // East at sunrise, high noon above the tree, west at sunset.
      sun.position.set(-Math.cos(theta)*22,3.0+Math.max(0,elevation)*22.0,8+Math.max(0,elevation)*4);
      sun.intensity=lerp('sunI');
      interpolateColor(sun.color,a.sun,b.sun,f);
      interpolateColor(sky.color,a.hemi,b.hemi,f);
      interpolateColor(sky.groundColor,a.ground,b.ground,f);
      sky.intensity=lerp('hemiI');
      bounce.intensity=lerp('bounce');
      renderer.toneMappingExposure=lerp('exposure');
      // Slow pre-dawn / post-sunset visual changes remain smooth while we
      // avoid uploading a canvas texture on every animation frame.
      if(forceSky||Math.abs(hour-lastSkyHours)>=.025||hour<lastSkyHours){
        interpolateColor(bgCenter,a.bg[0],b.bg[0],f);
        interpolateColor(bgMiddle,a.bg[1],b.bg[1],f);
        interpolateColor(bgEdge,a.bg[2],b.bg[2],f);
        paintBackdrop(bgCenter,bgMiddle,bgEdge);lastSkyHours=hour;
      }
      // Change the subtle UI/stars with sun position, not a hard-coded switch.
      const darkBlend=1-THREE.MathUtils.smoothstep(elevation,-.12,.16);
      stars.style.opacity=String(darkBlend*.94);
      waterMaterial.color.set(0xc5fcf5).lerp(new THREE.Color(0x8cb7d2),darkBlend*.70);
      rippleMat.color.set(0xd4ffff).lerp(new THREE.Color(0x92c7ea),darkBlend*.50);
      sprayMat.color.set(0xb8fbf4).lerp(new THREE.Color(0x7bc7eb),darkBlend*.55);
      const isNight=hour>=19||hour<5.5;
      document.body.classList.toggle('night',isNight);
      toggle(nightBtn,isNight);nightLabel.textContent=isNight?'跳至白天':'跳至夜晚';
      const [phase,icon]=describeHour(hour);
      timeIcon.textContent=icon;
      timeClock.textContent=formatClock(hour);
      const portion=hour/24,angle=portion*2*Math.PI;
      timeArc.setAttribute('stroke-dasharray',`${Math.max(0.0001,portion*ringCircumference)} ${ringCircumference}`);
      timeKnob.setAttribute('cx',String(90+69*Math.sin(angle)));
      timeKnob.setAttribute('cy',String(90-69*Math.cos(angle)));
      timeDial.setAttribute('aria-valuenow',String(Math.round(hour*60)));
      timeDial.setAttribute('aria-valuetext',`${formatClock(hour)} ${phase}`);
      timeDial.style.setProperty('--ring-color',hour>=19||hour<5.5?'#aabbe4':hour<7.5||hour>=17?'#ee976b':'#e99657');
    }
    // Pointer movement across the dial maps to 00:00 (top), 06:00 (right),
    // 12:00 (bottom) and 18:00 (left). Support mouse, stylus and touch.
    let draggingDial=false,dragPointerId=null;
    // Dragging the ring only moves the time of day: it leaves the day/night
    // cycle running instead of silently pausing it. Keyboard nudges keep the
    // pause so a precise minute can be dialled in without drifting.
    function setDialMinutes(minute,pausePlayback=false){
      if(pausePlayback){cyclePlaying=false;updatePlayButton();}
      const next=((Math.round(minute)%1440)+1440)%1440;
      timeHours=next/60;
      applySolarCycle(true);
    }
    function readPointerTime(e){
      const rect=timeDial.getBoundingClientRect();
      const dx=e.clientX-(rect.left+rect.width/2),dy=e.clientY-(rect.top+rect.height/2);
      const angle=(Math.atan2(dx,-dy)+Math.PI*2)%(Math.PI*2);
      return Math.round(angle/(Math.PI*2)*1440)%1440;
    }
    timeDial.addEventListener('pointerdown',e=>{
      if(e.button!==0)return;
      const rect=timeDial.getBoundingClientRect();
      const dx=e.clientX-(rect.left+rect.width/2),dy=e.clientY-(rect.top+rect.height/2);
      const dist=Math.hypot(dx,dy)/rect.width;
      // Only the circular track responds: the center remains a clear readout.
      if(dist<.245||dist>.55)return;
      e.preventDefault();timeDial.focus({preventScroll:true});
      draggingDial=true;dragPointerId=e.pointerId;
      timeDial.setPointerCapture(e.pointerId);
      setDialMinutes(readPointerTime(e));
    });
    timeDial.addEventListener('pointermove',e=>{
      if(draggingDial&&e.pointerId===dragPointerId)setDialMinutes(readPointerTime(e));
    });
    function stopDialDrag(e){
      if(e.pointerId===dragPointerId){draggingDial=false;dragPointerId=null;}
    }
    timeDial.addEventListener('pointerup',stopDialDrag);
    timeDial.addEventListener('pointercancel',stopDialDrag);
    // Keyboard alternative to drag, including precise minute adjustments.
    timeDial.addEventListener('keydown',e=>{
      let next=Math.round(timeHours*60);
      if(e.key==='ArrowRight'||e.key==='ArrowUp')next+=e.shiftKey?1:5;
      else if(e.key==='ArrowLeft'||e.key==='ArrowDown')next-=e.shiftKey?1:5;
      else if(e.key==='PageUp')next+=30;
      else if(e.key==='PageDown')next-=30;
      else if(e.key==='Home')next=0;
      else if(e.key==='End')next=1439;
      else return;
      e.preventDefault();setDialMinutes(next,true);
    });
    timePlayBtn.addEventListener('click',()=>{cyclePlaying=!cyclePlaying;updatePlayButton();});
    updatePlayButton();
    const rotateBtn=document.getElementById('rotateBtn');
    const leafBtn=document.getElementById('leafBtn');
    const nightBtn=document.getElementById('nightBtn');
    const dofBtn=document.getElementById('dofBtn');
    const resetBtn=document.getElementById('resetBtn');
    const prefersReduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    let leavesOn=!prefersReduced;
    const toggle=(button,on)=>{button.classList.toggle('active',on);button.setAttribute('aria-pressed',String(on));};
    toggle(leafBtn,leavesOn);falling.visible=leavesOn;
    if(prefersReduced){dofOn=false;toggle(dofBtn,false);}
    rotateBtn.addEventListener('click',()=>{controls.autoRotate=!controls.autoRotate;controls.autoRotateSpeed=.75;toggle(rotateBtn,controls.autoRotate);});
    leafBtn.addEventListener('click',()=>{leavesOn=!leavesOn;falling.visible=leavesOn;toggle(leafBtn,leavesOn);});
    dofBtn.addEventListener('click',()=>{dofOn=!dofOn;toggle(dofBtn,dofOn);});
    nightBtn.addEventListener('click',()=>{
      const h=(timeHours%24+24)%24;
      const isNight=h>=19||h<5.5;
      cyclePlaying=false;updatePlayButton();
      timeHours=isNight?10:22;
      applySolarCycle(true);
    });
    applySolarCycle(true);
    function frameCamera(){
      const aspect=window.innerWidth/window.innerHeight;
      camera.aspect=aspect;
      // Preserve framing on tall screens without cropping the canopy.
      camera.fov=aspect<.75?46:aspect<1.05?40:35;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth,window.innerHeight,false);
      const drawSize=renderer.getDrawingBufferSize(new THREE.Vector2());
      sceneTarget.setSize(drawSize.x,drawSize.y);
      horizontalTarget.setSize(drawSize.x,drawSize.y);
      horizontalMat.uniforms.uResolution.value.copy(drawSize);
      verticalMat.uniforms.uResolution.value.copy(drawSize);
      const nextY=window.innerWidth<590?2.9:2.55;
      const shift=nextY-controls.target.y;
      camera.position.y+=shift;controls.target.y=nextY;
      controls.update();
    }
    frameCamera();window.addEventListener('resize',frameCamera);
    resetBtn.addEventListener('click',()=>{
      controls.autoRotate=false;toggle(rotateBtn,false);
      const t=new THREE.Vector3(0,window.innerWidth<590?2.9:2.55,0);
      controls.target.copy(t);camera.position.copy(t).add(initialOffset);
      controls.update();
    });
    canvas.addEventListener('keydown',e=>{
      if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
        const angle=e.key==='ArrowLeft'?.15:-.15;
        camera.position.sub(controls.target).applyAxisAngle(new THREE.Vector3(0,1,0),angle).add(controls.target);
      }else if(e.key==='+'||e.key==='='){
        camera.position.sub(controls.target).multiplyScalar(.9).add(controls.target);
      }else if(e.key==='-'){
        camera.position.sub(controls.target).multiplyScalar(1.1).add(controls.target);
      }else return;
      controls.update();e.preventDefault();
    });
    let previous=performance.now(),elapsed=0;
    renderer.setAnimationLoop((now)=>{
      const dt=Math.min(.05,Math.max(0,(now-previous)/1000));previous=now;elapsed+=dt;
      controls.update();
      // Freeze advancement only while the ring is held, so the knob tracks the
      // finger; releasing it resumes the cycle from wherever it was dropped.
      if(cyclePlaying&&!draggingDial){
        // A full 24-hour cycle takes two real minutes; it loops at midnight.
        timeHours=(timeHours+dt*24/120)%24;
        applySolarCycle();
      }
      const t=prefersReduced?0:elapsed;
      if(!prefersReduced)animateWind(t);
      waterTime.value=t;
      for(let i=0;i<rippleData.length;i++){
        const r=rippleData[i];
        temp.position.set(r.x+Math.sin(t*r.speed+r.phase)*.035,.236+Math.sin(t*1.3+r.phase)*.004,
          r.z+Math.cos(t*r.speed*.62+r.phase)*.031);
        temp.rotation.set(0,Math.sin(t*.27+r.phase)*.30,0);
        temp.scale.set(r.w,.007,.018);
        temp.updateMatrix();ripples.setMatrixAt(i,temp.matrix);
      }
      ripples.instanceMatrix.needsUpdate=true;
      for(let i=0;i<waterfallStrips.length;i++){
        const w=waterfallStrips[i];
        temp.position.set(w.x,w.y+Math.sin(t*1.7+w.phase)*.028,w.z);
        temp.rotation.set(0,0,0);temp.scale.set(.079,w.length,.09);
        temp.updateMatrix();waterfall.setMatrixAt(i,temp.matrix);
      }
      waterfall.instanceMatrix.needsUpdate=true;
      for(const s of sprays){
        const cycle=(t*s.speed+s.phase)%2.85;
        s.obj.position.set(s.x+Math.sin(t*.75+s.phase)*.04,.21-cycle, s.z+.017);
      }
      if(leavesOn){
        for(let i=0;i<moving.length;i++){
          const l=moving[i],fall=((l.y-t*l.speed+164)%8.2)-.35;
          temp.position.set(l.x+Math.sin(t*.76+l.phase)*.42,fall,l.z+Math.cos(t*.6+l.phase)*.3);
          temp.rotation.set(t*.57+l.phase,t*.9+l.phase,t*.3);
          temp.scale.set(l.s,l.s*.49,l.s*.81);
          temp.updateMatrix();falling.setMatrixAt(i,temp.matrix);
        }
        falling.instanceMatrix.needsUpdate=true;
      }
      updateTiltFocus();
      renderWithTiltShift();
      if(!window.__voxelReady){window.__voxelReady=true;loading.classList.add('off');setTimeout(()=>loading.remove(),600);}
    });
  </script>
</body>
